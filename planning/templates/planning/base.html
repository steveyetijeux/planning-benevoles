<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Planning bénévoles
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #1e293b;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 24px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn-primary {
            background-color: #2563eb;
            border: none;
        }

        .btn-success {
            background-color: #16a34a;
            border: none;
        }

        footer {
            margin-top: 80px;
            padding: 30px;
            text-align: center;
            background-color: #1e293b;
            color: white;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/">
            Planning Bénévoles
        </a>

    </div>

</nav>

<div class="container mt-5">

    {% block content %}
    {% endblock %}

</div>

<footer>

    Gestion des bénévoles © 2026

</footer>

</body>

</html>
